<!DOCTYPE HTML>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<th:block th:replace="~{layout :: common-head('Bruine - Classement')}"></th:block>
	<link rel="stylesheet" th:href="@{/css/leaderboard.css}">
</head>

<body>
<header th:replace="~{layout :: header-and-nav}"></header>

<main class="leaderboard-container">

	<h1 class="title has-text-centered" style="color:var(--text); margin-bottom:0.25rem;">
		Classement Bruine
	</h1>

	<!-- Tabs -->
	<div class="lb-tabs">
		<a th:href="@{/leaderboard/playtime}"
		   th:classappend="${statMode == 'playtime'} ? 'active' : ''"
		   class="lb-tab">Temps de jeu</a>
		<a th:href="@{/leaderboard/xp}"
		   th:classappend="${statMode == 'xp'} ? 'active' : ''"
		   class="lb-tab">XP Bruine</a>
	</div>

	<!-- empty -->
	<div th:if="${top3.isEmpty()}"
	     style="text-align:center; padding:4rem 1rem; color:var(--text-muted);">
		<div style="font-size:3rem; margin-bottom:1rem;">🌧️</div>
		<p style="font-size:1.1rem; color:var(--text);">Aucun joueur inscrit pour le moment.</p>
		<p style="margin-top:0.5rem;">
			<a th:href="@{/steam/login}" style="color:var(--accent);">Connecte-toi avec Steam</a>
			pour rejoindre Bruine !
		</p>
	</div>

	<!-- Podium : 2e à gauche, 1re au centre, 3e à droite -->
	<div th:if="${!top3.isEmpty()}" class="podium-wrapper">
		<div th:each="i : ${ {1, 0, 2} }" th:if="${i < top3.size()}"
		     th:with="entry=${top3[i]}"
		     class="podium-slot" th:classappend="|rank-${i + 1}|">
			<div class="podium-card">
				<div class="podium-medal" th:text="${ {'🥇', '🥈', '🥉'}[i] }">🥇</div>
				<a th:href="@{/steam/profile/{id}(id=${entry.steamId})}"
				   th:text="${entry.username}"
				   class="podium-name">—</a>
				<div class="podium-stat" th:text="${entry.stat ?: 'Données privées'}">—</div>
			</div>
			<div class="podium-platform" th:text="${i + 1}">1</div>
		</div>
	</div>

	<div th:if="${!rest.isEmpty()}"
	     class="box" style="background:var(--bg-panel); border:1px solid var(--steam-blue-mid); padding:0; overflow:hidden;">
		<table class="rest-table">
			<thead>
			<tr>
				<th>#</th>
				<th>Joueur</th>
				<th th:text="${statMode == 'xp' ? 'XP Bruine' : 'Temps de jeu'}">Temps de jeu</th>
				<th>Inscrit le</th>
			</tr>
			</thead>
			<tbody>
			<tr th:each="u, row : ${rest}">
				<td class="rank-num" th:text="${row.index + 4}"></td>
				<td>
					<a th:href="@{/steam/profile/{id}(id=${u.steamId})}"
					   th:text="${u.username}"
					   style="color:var(--text); text-decoration:none;">—</a>
				</td>
				<td th:class="${statMode == 'xp' ? 'score-col' : 'playtime-col'}" th:text="${u.stat ?: '—'}">—</td>
				<td class="playtime-col" th:text="${#temporals.format(u.createdAt, 'dd/MM/yyyy')}">—</td>
			</tr>
			</tbody>
		</table>
	</div>

</main>

<th:block th:replace="~{layout :: footer-and-js}"></th:block>
</body>
</html>
