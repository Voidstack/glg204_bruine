# Desactive Flyway le schema est genere par Hibernate sur H2
spring.flyway.enabled=false
# Cree le schema au demarrage et le supprime a l'arret
spring.jpa.hibernate.ddl-auto=create-drop
# N'affiche pas les requetes SQL dans les logs
spring.jpa.show-sql=false
# Cle Steam factice : aucun appel reseau vers Steam en test
steam.token=test-steam-token
# Cle Stripe factice : aucun appel reseau vers Stripe en test
stripe.secret-key=sk_test_dummy
# Secret de webhook Stripe factice : les tests signent eux-memes leurs evenements
stripe.webhook-secret=whsec_test_dummy
