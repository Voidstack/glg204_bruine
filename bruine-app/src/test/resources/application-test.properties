# Profil des tests (@DataJpaTest et @SpringBootTest + @ActiveProfiles("test")).
# La source de donnees n'est pas declaree ici : @DataJpaTest / @AutoConfigureTestDatabase
# la remplacent par une base H2 en memoire, creee et detruite pour chaque classe de test.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Secrets externes : valeurs bidons pour que le contexte complet demarre en test,
# aucun appel reseau n'est fait vers Steam ou Stripe pendant les tests.
steam.token=test-steam-token
stripe.secret-key=sk_test_dummy
