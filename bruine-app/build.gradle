plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencies {
    // Spring Boot core
    // JPA/Hibernate accès BDD (entités, repositories)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // MVC + serveur Tomcat embarqué (contrôleurs REST/HTML)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // Moteur de templates HTML côté serveur
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    // Bean Validation (@NotBlank, @Size...)
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // Spring Security auth, chaînes de filtres, MFA
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Rechargement à chaud en dev (jamais packagé en prod)
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Balises sec:* dans Thymeleaf (sec:authentication...)
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

    // JUnit 5, Mockito, AssertJ, MockMvc
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Helpers de test d'authentification/autorisation
    testImplementation 'org.springframework.security:spring-security-test'
    // Base en memoire des tests @DataJpaTest
    testRuntimeOnly 'com.h2database:h2'

    // Génère getters/setters/constructeurs à la compilation
    compileOnly 'org.projectlombok:lombok:1.18.42'
    // Processeur d'annotations Lombok (obligatoire avec le compileOnly)
    annotationProcessor 'org.projectlombok:lombok:1.18.42'

    // Framework CSS Bulma servi via WebJars (version figée dans les URLs des templates)
    implementation "org.webjars.npm:bulma:0.9.4"

    // Driver JDBC MySQL/MariaDB (runtime seulement)
    runtimeOnly 'com.mysql:mysql-connector-j'

    // Migrations de schéma versionnées (V1...V10)
    implementation 'org.flywaydb:flyway-core'
    // Support Flyway spécifique MySQL/MariaDB
    implementation 'org.flywaydb:flyway-mysql'

    // SDK Stripe paiements Checkout de la boutique
    implementation 'com.stripe:stripe-java:26.3.0'

    // MFA / TOTP admin (compatible Google Authenticator, Authy, etc.) algo implémenté maison (RFC 6238)
    // Apache Commons Codec encodage Base32 du secret (version gérée par Spring Boot)
    implementation 'commons-codec:commons-codec'
    // Encodage du QR code d'enrôlement
    implementation 'com.google.zxing:core:3.5.3'
    // Rendu du QR code en image PNG (Java SE)
    implementation 'com.google.zxing:javase:3.5.3'

    // Lanceur JUnit Platform (exécution des tests au runtime)
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
